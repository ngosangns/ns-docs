version: "3"

tasks:
  web:setup:
    desc: Install the site's SolidJS build dependencies
    cmds:
      - npm run web:setup

  web:build:
    desc: Build the knowledge base site
    cmds:
      - npm run web:build

  web:serve:
    desc: Serve the site locally and live-reload on note edits
    cmds:
      - npm run web:serve

  web:deploy:
    desc: Build and deploy the site to Cloudflare Pages
    cmds:
      - npm run web:deploy
