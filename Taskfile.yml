version: "3"

tasks:
  web:setup:
    desc: Install Quartz dependencies and community plugins
    cmds:
      - npm run web:setup

  web:build:
    desc: Build the knowledge base site with Quartz
    cmds:
      - npm run web:build

  web:serve:
    desc: Build, serve locally and watch notes with Quartz
    cmds:
      - npm run web:serve

  web:deploy:
    desc: Build and deploy the Quartz site to Cloudflare Pages
    cmds:
      - npm run web:deploy
